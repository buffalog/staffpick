name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # Real Postgres, major version 18 — pinned to match the Railway deploy target
    # (ghcr.io/railwayapp-templates/postgres-ssl:18), so the partial unique indexes and the
    # rest of the Postgres-specific DDL are exercised faithfully.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: staffpick
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    # Inherited by every step, and Laravel's env repository is immutable
    # (Env::getRepository() builds with ->immutable()), so this real environment variable
    # takes precedence over whatever DB_PASSWORD sits in .env.testing.
    env:
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, bcmath, exif, intl, pcntl, sockets, xml, zip, mbstring, gd, imagick, dom
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan key:generate --env=testing
          # Point the testing env at the service-container Postgres. The committed
          # .env.testing targets a local Postgres 18 container on 5433 (so it does not
          # collide with a developer's own Postgres on 5432); CI has the port to itself.
          sed -i \
            -e 's#^DB_CONNECTION=.*#DB_CONNECTION=pgsql#' \
            -e 's#^DB_HOST=.*#DB_HOST=127.0.0.1#' \
            -e 's#^DB_PORT=.*#DB_PORT=5432#' \
            -e 's#^DB_DATABASE=.*#DB_DATABASE=staffpick#' \
            -e 's#^DB_USERNAME=.*#DB_USERNAME=postgres#' \
            .env.testing
          # The password is rewritten separately, and deliberately not with sed: the value is a
          # secret chosen outside this file, and sed would interpret '#' (the delimiter here),
          # '&' and '\' inside it. Deleting the line and appending it with printf treats the
          # value as literal text whatever it contains. It is also read from the job env rather
          # than interpolated as a GitHub expression into a shell script, per GitHub's
          # script-injection guidance.
          sed -i '/^DB_PASSWORD=/d' .env.testing
          printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD" >> .env.testing

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Run test suite
        run: php artisan test --compact
