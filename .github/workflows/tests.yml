name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # Real Postgres, major version 18 — pinned to match the Railway deploy target
    # (ghcr.io/railwayapp-templates/postgres-ssl:18), so the partial unique indexes and the
    # rest of the Postgres-specific DDL are exercised faithfully.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: StaffPick_CI_2026!
          POSTGRES_DB: staffpick
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DB_PASSWORD: "StaffPick_CI_2026!"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, bcmath, exif, intl, pcntl, sockets, xml, zip, mbstring, gd, imagick, dom
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan key:generate --env=testing
          # Point the testing env at the service-container Postgres. The committed
          # .env.testing targets a local Postgres 18 container on 5433 (so it does not
          # collide with a developer's own Postgres on 5432); CI has the port to itself.
          sed -i \
            -e 's#^DB_CONNECTION=.*#DB_CONNECTION=pgsql#' \
            -e 's#^DB_HOST=.*#DB_HOST=127.0.0.1#' \
            -e 's#^DB_PORT=.*#DB_PORT=5432#' \
            -e 's#^DB_DATABASE=.*#DB_DATABASE=staffpick#' \
            -e 's#^DB_USERNAME=.*#DB_USERNAME=postgres#' \
            -e 's#^DB_PASSWORD=.*#DB_PASSWORD=StaffPick_CI_2026!#' \
            .env.testing

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Run test suite
        run: php artisan test --compact
